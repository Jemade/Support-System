  <!-- A2: Upward Chevron ('^') -->
  <path d="M 68 33 L 81 8 L 94 33" stroke="#13A3AF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- N: Bold letterform -->
  <path d="M 102 33 V 8 L 122 33 V 8" stroke="#13A3AF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- T: Bold letterform -->
  <path d="M 129 8 H 151 M 140 8 V 33" stroke="#13A3AF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- i: Lowercase with separated round dot -->
  <path d="M 158 16 V 33" stroke="#13A3AF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="158" cy="9" r="2.8" fill="#13A3AF"/>
  <!-- S: Geometric curvature -->
  <path d="M 188 14 C 188 9 181 8 175 8 C 168 8 165 11 165 14.5 C 165 21 188 19 188 27 C 188 33 177 33.5 168 33.5 C 161 33.5 158 31 158 28" stroke="#13A3AF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Subtitle: Product of Zimbabwe in lighter muted teal (#98D3D8) -->
  <text x="44" y="44" fill="#98D3D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8.5" letter-spacing="2.4">PRODUCT OF ZIMBABWE</text>
</svg>
